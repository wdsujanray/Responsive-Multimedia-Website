<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Screen Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100vw;
      height: 100vh;
      padding: 20px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

<video autoplay loop playsinline>
  <source src="sk.mp4" type="video/mp4">
  <source src="sk.ogg" type="video/ogg">
  Your browser does not support the video tag.
</video>

</body>
</html>
